name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test/${{ matrix.os }}-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - xcode-27
        variant:
          - default
          - purego
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go test -race
        if: matrix.variant == 'default'
        run: go test -v -race ./...

      - name: go test -tags=purego
        if: matrix.variant == 'purego'
        run: go test -v -tags=purego ./...

  flatekp-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: ${{ hashFiles('flatekp/go.mod') != '' }}
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go build
        if: ${{ hashFiles('flatekp/go.mod') != '' }}
        working-directory: flatekp
        run: go build ./...

      - name: go vet
        if: ${{ hashFiles('flatekp/go.mod') != '' }}
        working-directory: flatekp
        run: go vet ./...

      - name: go test -race
        if: ${{ hashFiles('flatekp/go.mod') != '' }}
        working-directory: flatekp
        run: go test -race ./...

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # bench/internal/thirdparty vendors verbatim upstream masking kernels
      # for benchmark comparison; they keep upstream formatting as-is.
      - name: gofmt -s
        run: |
          out="$(gofmt -s -l $(git ls-files '*.go' ':!bench/internal/thirdparty'))"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt -s found unformatted files (run: gofmt -s -w .)"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: gofumpt -extra
        run: |
          out="$(go run mvdan.cc/gofumpt@latest -extra -l $(git ls-files '*.go' ':!bench/internal/thirdparty'))"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofumpt -extra found unformatted files (run: gofumpt -extra -w .)"
            exit 1
          fi

      - name: asmfmt
        run: |
          out="$(go run github.com/klauspost/asmfmt/cmd/asmfmt@latest -l $(git ls-files '*.s'))"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::asmfmt found unformatted assembly files (run: asmfmt -w <file>.s)"
            exit 1
          fi

  bench-build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: ${{ hashFiles('bench/go.mod') != '' }}
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go build
        if: ${{ hashFiles('bench/go.mod') != '' }}
        working-directory: bench
        run: go build ./...

      - name: go vet
        if: ${{ hashFiles('bench/go.mod') != '' }}
        working-directory: bench
        run: go vet ./...
