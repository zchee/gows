name: bench

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Every step is written for bash, whatever the runner's default shell.
    shell: bash

# Benchmark evidence is produced only by controlled local benchmark
# sessions. This workflow gates the source, harness, and supported
# assembly-provenance implementation; it never promotes CI timings to
# benchmark evidence.
env:
  GOENV: "off"
  GOFIPS140: "latest"
  GOTOOLCHAIN: "local"
  GOEXPERIMENT: ""
  GOFLAGS: "-mod=mod"
  GOWORK: "off"

jobs:
  source-and-harness:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      # The default cache-dependency-path glob covers the root, bench and
      # flatekp go.sum files.
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: bench-source-and-harness

      - name: Verify stock toolchain identity
        run: |
          set -euo pipefail
          test -z "$(go env GOEXPERIMENT)" || {
            printf 'custom GOEXPERIMENT is not allowed: %s\n' \
              "$(go env GOEXPERIMENT)" >&2
            exit 1
          }
          case "$(go version)" in
            *" X:"*)
              printf 'custom Go build is not allowed: %s\n' "$(go version)" >&2
              exit 1
              ;;
          esac
          test "${GOENV}" = "off"
          test "${GOFIPS140}" = "latest"
          test "${GOTOOLCHAIN}" = "local"
          test "${GOFLAGS}" = "-mod=mod"

      - name: Download locked module graphs
        run: |
          go mod download
          go -C bench mod download
          go -C flatekp mod download

      - name: Verify generated benchmark metadata
        run: go -C bench run ./harness/cmd/benchdoc

      - name: Root unit and vet gates
        run: |
          go test ./... -count=1
          go vet ./...

      - name: Root race gate
        run: go test -race ./... -count=1

      - name: Harness adversarial gates
        run: |
          go -C bench test \
            ./harness/artifact \
            ./harness/cmd/benchdoc \
            ./harness/cmd/benchcmp \
            ./harness/cmd/benchrun \
            ./harness/cmd/echoserver \
            ./harness/cmd/loadgen \
            ./harness/cmd/phase0receipt \
            ./harness/cmd/phase0verify \
            ./harness/doccheck \
            ./harness/evidence \
            ./harness/paired \
            ./harness/phase0 \
            ./harness/policy \
            ./harness/support \
            -count=1
          go -C bench test . ./internal/... -count=1
          go -C bench vet ./...

      # flatekp requires the published gows tag; the workspace binds it to
      # this checkout for the gate without editing a tracked file, and is
      # scoped to the step so the toolchain-identity gate's GOWORK=off
      # stays in force everywhere else. Workspace mode accepts only
      # -mod=readonly or -mod=vendor, so the job-wide -mod=mod is replaced
      # for this step.
      - name: Flatekp unit and vet gates
        run: |
          printf 'go %s\n\nuse (\n\t%s\n\t%s/flatekp\n)\n' \
            "${{ steps.go.outputs.version }}" "${GITHUB_WORKSPACE}" "${GITHUB_WORKSPACE}" \
            >"${RUNNER_TEMP}/gows.work"
          export GOWORK="${RUNNER_TEMP}/gows.work" GOFLAGS=-mod=readonly
          go -C flatekp test ./... -count=1
          go -C flatekp vet ./...

      - name: Reject generated source drift
        run: |
          set -euo pipefail
          git diff --check
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$status" || {
            printf 'validation changed the checkout:\n%s\n' "$status" >&2
            exit 1
          }

  darwin-assembly-provenance:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: bench-darwin-assembly-provenance

      - name: Verify supported native stock toolchain
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = "darwin"
          case "$(go env GOARCH)" in
            amd64|arm64) ;;
            *)
              printf 'unsupported runner architecture: %s\n' \
                "$(go env GOARCH)" >&2
              exit 1
              ;;
          esac
          test -z "$(go env GOEXPERIMENT)"
          test "$(go env GOFIPS140)" = "latest"
          case "$(go version)" in
            *" X:"*)
              printf 'custom Go build is not allowed: %s\n' "$(go version)" >&2
              exit 1
              ;;
          esac

      - name: Download locked benchmark module graph
        run: |
          go -C bench mod download
          go -C bench list -mod=readonly -m all > /dev/null

      - name: Compile, link, and validate supported assembly provenance
        run: go -C bench test ./harness/assembly -count=1 -v

      - name: Reject generated source drift
        run: |-
          set -euo pipefail
          git diff --check
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$status" || {
            printf 'assembly validation changed the checkout:\n%s\n' \
              "$status" >&2
            exit 1
          }
