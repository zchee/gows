name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: gofmt -s
        run: |
          out="$(gofmt -s -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt -s found unformatted files (run: gofmt -s -w .)"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: gofumpt -extra
        run: |
          out="$(go run mvdan.cc/gofumpt@latest -extra -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofumpt -extra found unformatted files (run: gofumpt -extra -w .)"
            exit 1
          fi

      - name: asmfmt
        run: |
          out="$(go run github.com/klauspost/asmfmt/cmd/asmfmt@latest -l $(git ls-files '*.s'))"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::asmfmt found unformatted assembly files (run: asmfmt -w <file>.s)"
            exit 1
          fi

  test:
    name: test (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        variant: [default, purego]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: go test -race
        if: matrix.variant == 'default'
        run: go test -race ./...

      - name: go test -tags=purego
        if: matrix.variant == 'purego'
        run: go test -tags=purego ./...

  bench-build:
    name: bench-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: ${{ hashFiles('bench/go.mod') != '' }}
        with:
          go-version: '1.26.x'
          cache: true

      - name: go build
        if: ${{ hashFiles('bench/go.mod') != '' }}
        working-directory: bench
        run: go build ./...

      - name: go vet
        if: ${{ hashFiles('bench/go.mod') != '' }}
        working-directory: bench
        run: go vet ./...

  flatekp-test:
    name: flatekp-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: ${{ hashFiles('flatekp/go.mod') != '' }}
        with:
          go-version: '1.26.x'
          cache: true

      - name: go build
        if: ${{ hashFiles('flatekp/go.mod') != '' }}
        working-directory: flatekp
        run: go build ./...

      - name: go vet
        if: ${{ hashFiles('flatekp/go.mod') != '' }}
        working-directory: flatekp
        run: go vet ./...

      - name: go test -race
        if: ${{ hashFiles('flatekp/go.mod') != '' }}
        working-directory: flatekp
        run: go test -race ./...
