name: autobahn

# Phase 0: manual trigger only, since gows itself has no server/client yet
# (Phase 2). Once examples/autobahn lands this will be wired to push/PR
# alongside test.yaml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance-server:
    name: conformance (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: ${{ hashFiles('examples/autobahn/**/*.go') != '' }}
        with:
          go-version: '1.26.x'
          cache: true

      - name: Start example echo server
        if: ${{ hashFiles('examples/autobahn/**/*.go') != '' }}
        run: |
          go run ./examples/autobahn &
          echo $! > server.pid
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/9001) 2>/dev/null; then
              exec 3<&- 3>&-
              break
            fi
            sleep 1
          done

      - name: Run Autobahn conformance (server mode)
        if: ${{ hashFiles('examples/autobahn/**/*.go') != '' }}
        run: ./autobahn/run.sh server ws://127.0.0.1:9001

      - name: Stop example echo server
        if: ${{ always() && hashFiles('examples/autobahn/**/*.go') != '' }}
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: No example server yet
        if: ${{ hashFiles('examples/autobahn/**/*.go') == '' }}
        run: echo "::notice::examples/autobahn does not exist yet (Phase 2) — nothing to test. This job will exercise the gows server automatically once the example lands."
