name: autobahn

# Conformance gate for the gows server: runs the Autobahn|Testsuite
# fuzzingclient (docker image pinned by digest inside autobahn/run.sh)
# against the examples/autobahn echo server and fails on any
# non-conformant case.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance-server:
    name: conformance (server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Start example echo server
        run: |
          go run ./examples/autobahn -mode server &
          echo $! > server.pid
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/9001) 2>/dev/null; then
              exec 3<&- 3>&-
              break
            fi
            sleep 1
          done

      - name: Run Autobahn conformance (server mode)
        run: ./autobahn/run.sh server ws://127.0.0.1:9001

      - name: Stop example echo server
        if: ${{ always() }}
        run: kill "$(cat server.pid)" 2>/dev/null || true
