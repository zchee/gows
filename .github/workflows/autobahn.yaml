name: autobahn

# The Autobahn suite runs the echo server under examples/autobahn through
# the full conformance case list, which takes far longer than the unit
# gates in ci.yaml, so it stays a manual trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # Every step is written for bash, whatever the runner's default shell.
    shell: bash

jobs:
  conformance-server:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: autobahn-conformance-server

      - name: Start example echo server
        run: |
          go run ./examples/autobahn &
          echo $! > server.pid
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/9001) 2>/dev/null; then
              exec 3<&- 3>&-
              break
            fi
            sleep 1
          done

      - name: Run Autobahn conformance (server mode)
        run: ./autobahn/run.sh server ws://127.0.0.1:9001

      - name: Stop example echo server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
