name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Phase 0 evidence is produced only by controlled local benchmark sessions.
# This workflow gates the source, harness, and supported assembly-provenance
# implementation; it never promotes CI timings to benchmark evidence.
env:
  GOENV: "off"
  GOFIPS140: "latest"
  GOTOOLCHAIN: "local"
  GOEXPERIMENT: ""
  GOFLAGS: "-mod=mod"
  GOWORK: "off"

jobs:
  source-and-harness:
    name: source and harness (stock Go, linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            bench/go.sum
            flatekp/go.sum

      - name: Verify stock toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(go env GOVERSION)"
          test "$version" = "go1.26.5" || {
            printf 'unexpected Go version: %s\n' "$version" >&2
            exit 1
          }
          test -z "$(go env GOEXPERIMENT)" || {
            printf 'custom GOEXPERIMENT is not allowed: %s\n' \
              "$(go env GOEXPERIMENT)" >&2
            exit 1
          }
          case "$(go version)" in
            *" X:"*)
              printf 'custom Go build is not allowed: %s\n' "$(go version)" >&2
              exit 1
              ;;
          esac
          test "${GOENV}" = "off"
          test "${GOFIPS140}" = "latest"
          test "${GOTOOLCHAIN}" = "local"
          test "${GOFLAGS}" = "-mod=mod"

      - name: Download locked module graphs
        run: |
          go mod download
          go -C bench mod download
          go -C flatekp mod download

      - name: Verify generated benchmark metadata
        run: go -C bench run ./harness/cmd/benchdoc

      - name: Root unit and vet gates
        run: |
          go test ./... -count=1
          go vet ./...

      - name: Root race gate
        run: go test -race ./... -count=1

      - name: Phase 0 harness adversarial gates
        run: |
          go -C bench test \
            ./harness/artifact \
            ./harness/cmd/benchdoc \
            ./harness/cmd/benchcmp \
            ./harness/cmd/benchrun \
            ./harness/cmd/echoserver \
            ./harness/cmd/loadgen \
            ./harness/cmd/phase0receipt \
            ./harness/cmd/phase0verify \
            ./harness/doccheck \
            ./harness/evidence \
            ./harness/paired \
            ./harness/phase0 \
            ./harness/policy \
            ./harness/support \
            -count=1
          go -C bench test . ./internal/... -count=1
          go -C bench vet ./...

      - name: Flatekp unit and vet gates
        run: |
          go -C flatekp test ./... -count=1
          go -C flatekp vet ./...

      - name: Reject generated source drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$status" || {
            printf 'validation changed the checkout:\n%s\n' "$status" >&2
            exit 1
          }

  darwin-assembly-provenance:
    name: assembly provenance (darwin/amd64 and darwin/arm64)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: true
          cache-dependency-path: |
            go.sum
            bench/go.sum

      - name: Verify supported native stock toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.5"
          test "$(go env GOOS)" = "darwin"
          case "$(go env GOARCH)" in
            amd64|arm64) ;;
            *)
              printf 'unsupported runner architecture: %s\n' \
                "$(go env GOARCH)" >&2
              exit 1
              ;;
          esac
          test -z "$(go env GOEXPERIMENT)"
          test "$(go env GOFIPS140)" = "latest"
          case "$(go version)" in
            *" X:"*)
              printf 'custom Go build is not allowed: %s\n' "$(go version)" >&2
              exit 1
              ;;
          esac

      - name: Download locked benchmark module graph
        run: go -C bench mod download

      - name: Compile, link, and validate supported assembly provenance
        run: go -C bench test ./harness/assembly -count=1 -v

      - name: Reject generated source drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          status="$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$status" || {
            printf 'assembly validation changed the checkout:\n%s\n' \
              "$status" >&2
            exit 1
          }
