name: bench

# Informational only: this workflow never gates merges. It is manually
# triggered and its job is allowed to fail without turning the workflow red.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: bench (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run benchmarks
        run: go test -bench=. -benchmem -count=6 ./internal/... | tee bench.out

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench.out
          if-no-files-found: warn
